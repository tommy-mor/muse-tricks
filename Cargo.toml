[package]
name = "sorter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sorter"
path = "src/main.rs"

[dependencies]
# Master picked redb: pure Rust, no C++ on the sandbox. same Db/Batch API.
durable = { path = "../durable/durable", default-features = false, features = ["backend-redb"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15"
